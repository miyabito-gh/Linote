[package]
name = "linote"
version = "0.1.0"
edition = "2021"
description = "Lightweight text editor for Windows"
publish = false

[[bin]]
name = "linote"
path = "src/main.rs"

[lib]
name = "linote"
path = "src/lib.rs"

[dependencies]
encoding_rs = "0.8"
regex = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
