[package]
name = "linote"
version = "0.1.4"
edition = "2021"
description = "Lightweight text editor for Windows"
publish = false

[[bin]]
name = "linote"
path = "src/main.rs"

[lib]
name = "linote"
path = "src/lib.rs"

[dependencies]
encoding_rs = "0.8"
regex = "1"
# コマンドの引数・結果、設定、将来の MCP の値の表現。derive（proc-macro）は使わない。
serde_json = "1"
# Markdown（G）
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Xps",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dxgi_Common",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_Controls",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_Ime",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
# WebView2 の COM インターフェース定義のみ使う（ローダー関数は呼ばない。H）
webview2-com = "0.39"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
